<!doctype html>
<meta charset="utf-8" />
<title>Drop Finder — дропи</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #171a2b;
    --line: #262a41;
    --txt: #e7e9f3;
    --muted: #9aa0bd;
    --green: #34d399;
    --amber: #fbbf24;
    --orange: #fb923c;
    --red: #f87171;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font: 14px/1.45 system-ui, -apple-system, sans-serif;
    color: var(--txt);
    background: var(--bg);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  input[type='search'] {
    flex: 1; min-width: 220px; background: #0d1020; color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: 13px system-ui, sans-serif;
  }
  select, button {
    background: var(--card); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font: 13px system-ui, sans-serif; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.chk { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 8px; }
  .brand { font-size: 15px; font-weight: 700; }
  .kw { color: var(--muted); }
  .geo { color: var(--muted); font-size: 12px; }
  .dropcount {
    font-size: 11px; font-weight: 700; color: var(--orange);
    background: rgba(251, 146, 60, 0.14); border: 1px solid rgba(251,146,60,.4);
    padding: 1px 8px; border-radius: 999px;
  }
  .dropcount.zero { color: var(--muted); background: transparent; border-color: var(--line); font-weight: 600; }
  .card.pending { opacity: 0.72; border-style: dashed; }
  .me { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .me .lbl { color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px;
    border-radius: 6px; font-weight: 700; font: 12px ui-monospace, Consolas, monospace;
  }
  .p-good { background: rgba(52, 211, 153, 0.16); color: var(--green); }
  .p-mid { background: rgba(251, 191, 36, 0.16); color: var(--amber); }
  .p-bad { background: rgba(248, 113, 113, 0.16); color: var(--red); }

  .serp { display: flex; flex-direction: column; gap: 4px; }
  .srow {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 7px 9px; border-radius: 8px; border: 1px solid transparent;
    background: #12152400;
  }
  .srow:hover { background: rgba(255,255,255,0.02); }
  .srow.k-you {
    background: rgba(52, 211, 153, 0.10);
    border-color: rgba(52, 211, 153, 0.55);
    box-shadow: 0 0 0 1px rgba(52,211,153,.25), 0 0 14px rgba(52,211,153,.18);
  }
  /* Auto-detected drop — solid orange glow, the thing you're here to watch. */
  .srow.k-drop {
    background: rgba(251, 146, 60, 0.13);
    border-color: rgba(251, 146, 60, 0.7);
    box-shadow: 0 0 0 1px rgba(251,146,60,.3), 0 0 16px rgba(251,146,60,.22);
  }
  .rk {
    flex: 0 0 34px; text-align: right; color: var(--muted);
    font: 12px ui-monospace, Consolas, monospace; padding-top: 2px;
  }
  .tag {
    flex: 0 0 auto; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px; padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    align-self: flex-start; margin-top: 1px;
  }
  .tag.k-you { background: var(--green); color: #06281c; }
  .tag.k-own { background: rgba(52,211,153,.18); color: var(--green); }
  .tag.k-drop { background: var(--orange); color: #241206; }
  .tag.k-comp { background: rgba(248,113,113,.16); color: var(--red); }
  .tag.k-noise { background: #2a2f4a; color: var(--muted); }
  .tag.k-other { background: #232739; color: #6b7280; }
  .meta { flex: 1 1 auto; min-width: 0; }
  .host { font-weight: 600; font-size: 13px; }
  .host .ttl { font-weight: 400; color: var(--muted); }
  .urlline { display: flex; align-items: center; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .url {
    color: #a5b4fc; text-decoration: none; word-break: break-all;
    font: 12px ui-monospace, Consolas, monospace; user-select: all;
  }
  .copy {
    flex: 0 0 auto; font-size: 11px; padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer;
  }
  .copy:hover { color: var(--txt); border-color: var(--accent); }
  .copy.ok { color: var(--green); border-color: var(--green); }
  .none { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .badge { display:inline-block; font: 11px ui-monospace, monospace; color: var(--muted); }
</style>

<h1>🎯 Drop Finder — дропи</h1>
<div class="sub" id="sub">—</div>

<div class="toolbar">
  <input id="q" type="search" placeholder="Пошук: сайт, кейворд, гео, домен…" />
  <select id="geo"><option value="">Усі гео</option></select>
  <label class="chk"><input id="onlydrops" type="checkbox" /> Лише де є дропи</label>
  <button id="csv" class="primary">⭳ CSV</button>
  <button id="refresh">↻ Оновити</button>
</div>

<div id="list"></div>

<script src="drops.js"></script>
